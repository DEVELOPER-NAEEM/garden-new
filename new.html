<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Tailwind Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

  <div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold text-center mb-8">Responsive Tailwind Cards</h1>

    <div class="grid gap-6 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
      
      <!-- Card 1 -->
      <div class="bg-white shadow-md rounded-lg overflow-hidden transition transform hover:scale-105">
        <img src="https://via.placeholder.com/400x200" alt="Card 1 Image" class="w-full h-48 object-cover">
        <div class="p-6">
          <h2 class="text-xl font-semibold mb-2">Card Title 1</h2>
          <p class="text-gray-600 mb-4">This is a description for the first card. It adapts to any screen size.</p>
          <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Read More</button>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="bg-white shadow-md rounded-lg overflow-hidden transition transform hover:scale-105">
        <img src="https://via.placeholder.com/400x200" alt="Card 2 Image" class="w-full h-48 object-cover">
        <div class="p-6">
          <h2 class="text-xl font-semibold mb-2">Card Title 2</h2>
          <p class="text-gray-600 mb-4">This is a description for the second card. It's clean and responsive.</p>
          <button class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Learn More</button>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="bg-white shadow-md rounded-lg overflow-hidden transition transform hover:scale-105">
        <img src="https://via.placeholder.com/400x200" alt="Card 3 Image" class="w-full h-48 object-cover">
        <div class="p-6">
          <h2 class="text-xl font-semibold mb-2">Card Title 3</h2>
          <p class="text-gray-600 mb-4">This is the third card. All cards look good on mobile, tablet, and desktop.</p>
          <button class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">Discover</button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
